services:
  app:
    build: .
    image: mystery-session-studio:latest
    container_name: ${COMPOSE_PROJECT_NAME:-mystery}-app
    ports:
      # 仅把应用服务端口发布到宿主；宿主端口由评估环境变量 CC_PUBLISH_PORT 注入，容器内固定 8080
      - "${CC_PUBLISH_PORT}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
